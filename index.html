<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US-Bangla MASS Hand Over List Generator</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
        }
        .hidden { display: none !important; }
        
        /* Containers */
        .screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Splash Screen */
        #splash-screen {
            background-color: #0b2e59;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            animation: fadeInOut 3s ease-in-out forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.9); }
            20% { opacity: 1; transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1); }
        }

        /* Form Styles (Login & Dashboard) */
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        .form-container h2 {
            text-align: center;
            color: #0b2e59;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #0b2e59;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn:hover { background-color: #061d38; }
        .btn-secondary { background-color: #555; }
        .btn-secondary:hover { background-color: #333; }
        
        .btn-logout {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-logout:hover { background-color: #c9302c; }

        /* Report Page Styles */
        #report-screen {
            background-color: white;
            justify-content: flex-start;
            padding: 40px;
            font-family: 'Times New Roman', Times, serif;
            color: #000;
            text-transform: uppercase;
            width: 100%;
            box-sizing: border-box;
        }
        
        /* Each individual Page Container */
        .report-page {
            width: 100%;
            max-width: 850px;
            margin: 0 auto 50px auto;
            border-bottom: 2px dashed #ccc; /* Visual separation on screen */
            padding-bottom: 50px;
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid black;
            padding-bottom: 15px;
            gap: 15px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            white-space: nowrap; 
        }
        .brand-text-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
        }
        .brand-name {
            font-family: Arial, sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: 26px;
            color: #0b2e59;
            line-height: 1;
            white-space: nowrap;
        }
        .brand-sub {
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 5px;
            color: black;
            margin-top: 5px;
            font-weight: bold;
            white-space: nowrap;
        }
        
        /* Modernized Title Line */
        .title-area {
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: #0b2e59;
            letter-spacing: 1px;
            background-color: #f0f4f8;
            padding: 10px 15px;
            border-radius: 6px;
            border-left: 6px solid #0b2e59;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
            text-align: center;
            flex: 1;
        }

        .flight-info {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            table-layout: fixed; 
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            word-wrap: break-word; 
        }
        th { font-size: 15px; }
        .note {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 30px;
            margin-top: 15px;
        }
        .ack-title {
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin: 20px auto;
            max-width: 500px;
            justify-content: center;
        }

        /* Guarantee Multiple Pages Print Settings */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0.5in;
            }
            body { background-color: white; }
            .screen { min-height: auto; padding: 0; display: block; }
            #report-screen { padding: 0; }
            
            .report-page {
                border-bottom: none;
                padding-bottom: 0;
                margin: 0;
                page-break-after: always; /* Force print break after each block */
                page-break-inside: avoid;
            }
            .report-page:last-child {
                page-break-after: auto; /* Prevent empty page at the end */
            }

            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <!-- 1. Splash Screen -->
    <div id="splash-screen" class="screen">
        WELCOME TO RADOAN'S APP
    </div>

    <!-- 2. Login Page -->
    <div id="login-screen" class="screen hidden">
        <div class="form-container">
            <h2>System Login</h2>
            <div class="form-group">
                <label>LOAD CONTROLLER</label>
                <input type="text" id="username" placeholder="Enter your name" required style="text-transform: uppercase;">
            </div>
            <div class="form-group">
                <label>DESIGNATION</label>
                <select id="designation">
                    <option value="EXECUTIVE">EXECUTIVE</option>
                    <option value="SR. EXE">SR. EXECUTIVE</option>
                </select>
            </div>
            <div class="form-group">
                <label>STATION</label>
                <select id="user-station">
                    <option value="DAC" selected>DAC</option>
                    <option value="CGP">CGP</option>
                    <option value="SPD">SPD</option>
                    <option value="JSR">JSR</option>
                    <option value="RJH">RJH</option>
                    <option value="ZYL">ZYL</option>
                    <option value="BZL">BZL</option>
                    <option value="CXB">CXB</option>
                </select>
            </div>
            <button class="btn" onclick="handleLogin()">LOG IN</button>
        </div>
    </div>

    <!-- 3. Dashboard / Data Entry Page -->
    <div id="dashboard-screen" class="screen hidden">
        <div class="form-container" style="max-width: 600px;">
            
            <!-- Welcome Header with Logout Button -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="welcome-text" style="text-transform: uppercase; margin: 0;">Welcome</h2>
                <button class="btn-logout" onclick="handleLogout()">LOG OUT</button>
            </div>
            
            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label>DATE <span style="color:red;">*</span></label>
                    <input type="date" id="flight-date" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>FLIGHT NO <span style="color:red;">*</span></label>
                    <input type="number" id="flight-no" placeholder="e.g. 315" required>
                </div>
            </div>

            <div class="form-group">
                <label>DESTINATION <span style="color:red;">*</span></label>
                <select id="flight-dest" required>
                    <option value="DAC">DAC</option>
                    <option value="CGP">CGP</option><option value="SPD">SPD</option>
                    <option value="ZYL">ZYL</option><option value="CXB">CXB</option>
                    <option value="JSR">JSR</option><option value="RJH">RJH</option>
                    <option value="BZL">BZL</option><option value="DXB">DXB</option>
                    <option value="AUH">AUH</option><option value="SHJ">SHJ</option>
                    <option value="RUH">RUH</option><option value="JED">JED</option>
                    <option value="MLE">MLE</option><option value="SIN">SIN</option>
                    <option value="CAN">CAN</option><option value="MCT">MCT</option>
                    <option value="BKK" selected>BKK</option><option value="CCU">CCU</option>
                    <option value="MAA">MAA</option><option value="KUL">KUL</option>
                    <option value="DOH">DOH</option>
                </select>
            </div>

            <div class="form-group">
                <label>CATEGORY <span style="color:red;">*</span></label>
                <select id="flight-category" required>
                    <option value="MAAS" selected>MAAS</option>
                    <option value="WCHR">WCHR</option>
                </select>
            </div>

            <div class="form-group">
                <label>FLST (Paste System Data Here)</label>
                <textarea id="flst-data" rows="8" placeholder="Paste user information from system here..." style="text-transform: uppercase;"></textarea>
            </div>

            <button class="btn" onclick="generateReport()">GENERATE</button>
        </div>
    </div>

    <!-- 4. Final Report Page -->
    <div id="report-screen" class="screen hidden">
        
        <!-- Multiple pages will be generated inside this container -->
        <div id="report-container" style="width: 100%;"></div>

        <!-- Buttons -->
        <div class="actions no-print">
            <button class="btn" onclick="window.print()">PRINT / SAVE AS PDF</button>
            <button class="btn btn-secondary" onclick="goBackToDashboard()">BACK TO EDIT</button>
        </div>
    </div>

    <script>
        let userData = { name: '', designation: '', station: '' };

        // Configuration for Auto-Filling Destination based on Flight Number
        const flightDestMap = {
            'CGP': [101,103,105,107,109,111,113,115,117,119],
            'ZYL': [531,533,535,537,539],
            'CXB': [141,143,145,147,149,151,153,155,157,159],
            'RJH': [161,163,165,167,169],
            'SPD': [191,193,195,197,199],
            'BZL': [171,173,175,179],
            'JSR': [121,123,125,127,129],
            'DXB': [341,343],
            'SHJ': [345,347],
            'AUH': [349,351],
            'RUH': [381,383],
            'JED': [361,363],
            'MLE': [337,339],
            'BKK': [217,219],
            'MCT': [321,323],
            'DOH': [333,335],
            'CCU': [201,203],
            'MAA': [205,207,209],
            'CAN': [325,327],
            'SIN': [307,309],
            'KUL': [315,317,319]
        };

        // Flatten dictionary for instant lookup
        const exactFlightDestMap = {};
        for (const [dest, flights] of Object.entries(flightDestMap)) {
            flights.forEach(f => exactFlightDestMap[f] = dest);
        }

        // Setup Event Listeners & Auto-Save
        const inputIds = ['flight-date', 'flight-no', 'flight-dest', 'flight-category', 'flst-data'];
        inputIds.forEach(id => {
            document.getElementById(id).addEventListener('input', function(e) {
                localStorage.setItem('massApp_' + id, e.target.value);
            });
        });

        // Listen explicitly to flight-no to trigger Auto-Fill
        document.getElementById('flight-no').addEventListener('input', function(e) {
            const flightNo = parseInt(e.target.value, 10);
            if (!isNaN(flightNo)) {
                let dest = null;
                if (flightNo % 2 === 0) {
                    dest = 'DAC'; // Every Even Number -> DAC
                } else if (exactFlightDestMap[flightNo]) {
                    dest = exactFlightDestMap[flightNo]; // Odd numbers -> Map lookup
                }
                
                if (dest) {
                    document.getElementById('flight-dest').value = dest;
                    localStorage.setItem('massApp_flight-dest', dest); // Save auto-fill to memory
                }
            }
        });

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('hidden');
                
                // Check if user is already logged in
                const savedName = localStorage.getItem('massApp_username');
                const savedDesig = localStorage.getItem('massApp_designation');
                const savedStation = localStorage.getItem('massApp_station');
                
                if (savedName && savedDesig && savedStation) {
                    userData.name = savedName;
                    userData.designation = savedDesig;
                    userData.station = savedStation;
                    document.getElementById('welcome-text').innerText = `WELCOME, ${userData.name}`;
                    
                    // Restore previously saved form data if available
                    inputIds.forEach(id => {
                        const savedValue = localStorage.getItem('massApp_' + id);
                        if(savedValue) {
                            document.getElementById(id).value = savedValue;
                        }
                    });

                    // If no date was saved, default to today
                    if(!document.getElementById('flight-date').value) {
                        document.getElementById('flight-date').value = new Date().toISOString().split('T')[0];
                    }

                    document.getElementById('dashboard-screen').classList.remove('hidden');
                } else {
                    // Show login if no session is found
                    document.getElementById('login-screen').classList.remove('hidden');
                    document.getElementById('flight-date').value = new Date().toISOString().split('T')[0];
                }
            }, 3000); 
        };

        function handleLogin() {
            const nameInput = document.getElementById('username').value.trim();
            const desigInput = document.getElementById('designation').value;
            const stationInput = document.getElementById('user-station').value;

            if (nameInput === '') {
                alert("Please enter Load Controller name.");
                return;
            }

            userData.name = nameInput.toUpperCase();
            userData.designation = desigInput.toUpperCase();
            userData.station = stationInput.toUpperCase();

            // Save login info so session isn't lost
            localStorage.setItem('massApp_username', userData.name);
            localStorage.setItem('massApp_designation', userData.designation);
            localStorage.setItem('massApp_station', userData.station);

            document.getElementById('welcome-text').innerText = `WELCOME, ${userData.name}`;
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
        }

        function handleLogout() {
            // Delete all saved user & form data
            localStorage.removeItem('massApp_username');
            localStorage.removeItem('massApp_designation');
            localStorage.removeItem('massApp_station');
            inputIds.forEach(id => localStorage.removeItem('massApp_' + id));

            // Reset variables and clear visual inputs
            userData = { name: '', designation: '', station: '' };
            document.getElementById('username').value = '';
            document.getElementById('user-station').value = 'DAC';
            document.getElementById('flight-no').value = '';
            document.getElementById('flight-category').value = 'MAAS';
            document.getElementById('flst-data').value = '';
            document.getElementById('flight-date').value = new Date().toISOString().split('T')[0];

            // Switch to Login screen
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function formatDate(dateStr) {
            if(!dateStr) return "";
            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            const d = new Date(dateStr);
            const day = String(d.getDate()).padStart(2, '0');
            const month = months[d.getMonth()];
            const year = String(d.getFullYear()).slice(-2);
            return `${day} ${month} ${year}`;
        }

        function parseFLST(text, selectedCategory) {
            let paxList = [];
            let lines = text.toUpperCase().split('\n');
            let currentPax = { name: '', seat: '', remarks: '' };

            lines.forEach(line => {
                let nameMatch = line.match(/([A-Z]+\/[A-Z\s]+?(?:\bMR\b|\bMS\b|\bMRS\b|\bMISS\b|\bMSTR\b)?)(?=\s{2,}|\sAD\b|\sCHD\b|\sINF\b|$)/);
                let seatMatch = line.match(/\b(\d{1,2}[A-K])\b/);

                if (nameMatch) {
                    if (currentPax.name) {
                        paxList.push({...currentPax});
                        currentPax = { name: '', seat: '', remarks: '' };
                    }
                    currentPax.name = nameMatch[1];
                }
                
                if (seatMatch && !currentPax.seat) {
                    currentPax.seat = seatMatch[1];
                }

                // Look for selected category first, fallback to MAAS/WCHR
                if (line.includes(selectedCategory)) {
                    currentPax.remarks = line.substring(line.indexOf(selectedCategory) + selectedCategory.length).trim();
                } else if (line.includes('MAAS')) {
                    currentPax.remarks = line.substring(line.indexOf('MAAS') + 4).trim();
                } else if (line.includes('WCHR')) {
                    currentPax.remarks = line.substring(line.indexOf('WCHR') + 4).trim();
                }
            });

            if (currentPax.name) {
                paxList.push(currentPax);
            }

            return paxList;
        }

        function generateReport() {
            const dateInput = document.getElementById('flight-date').value;
            const flightNoInput = document.getElementById('flight-no').value.trim();
            const destInput = document.getElementById('flight-dest').value.toUpperCase();
            const categoryInput = document.getElementById('flight-category').value.toUpperCase();
            const flstText = document.getElementById('flst-data').value;

            // Mandatory Field Checks
            if(dateInput === '') { alert("Please select Date."); return; }
            if(flightNoInput === '') { alert("Please enter Flight Number."); return; }
            if(destInput === '') { alert("Please select Destination."); return; }
            if(categoryInput === '') { alert("Please select Category."); return; }

            const formattedDate = formatDate(dateInput);
            const passengers = parseFLST(flstText, categoryInput);
            
            // Container where all dynamic pages will go
            const reportContainer = document.getElementById('report-container');
            reportContainer.innerHTML = ''; // Clear previous reports

            // Calculate total pages needed (min 1 page, max depends on passengers length)
            const totalPages = Math.max(1, Math.ceil(passengers.length / 8));

            for (let page = 0; page < totalPages; page++) {
                
                // Build Table Rows for this specific page (8 rows max)
                let tbodyHtml = '';
                for (let i = 0; i < 8; i++) {
                    const paxIndex = (page * 8) + i;
                    
                    if (paxIndex < passengers.length) {
                        const p = passengers[paxIndex];
                        tbodyHtml += `
                            <tr>
                                <td style="text-align:left; height: 35px;">${p.name || ''}</td>
                                <td style="height: 35px;">${p.seat || ''}</td>
                                <td style="height: 35px;">${destInput}</td>
                                <td style="height: 35px;">${categoryInput}</td> 
                                <td style="text-align:left; height: 35px;">${p.remarks || ''}</td>
                            </tr>
                        `;
                    } else {
                        // Empty Row Filler
                        tbodyHtml += `
                            <tr>
                                <td style="height: 35px;"></td>
                                <td style="height: 35px;"></td>
                                <td style="height: 35px;"></td>
                                <td style="height: 35px;"></td>
                                <td style="height: 35px;"></td>
                            </tr>
                        `;
                    }
                }

                // Construct the full HTML structure for this 1 Page
                const pageDiv = document.createElement('div');
                pageDiv.className = 'report-page';
                pageDiv.innerHTML = `
                    <div class="report-header">
                        <div class="logo-area">
                            <div class="brand-text-container">
                                <div class="brand-name">US-BANGLA</div>
                                <div class="brand-sub">A I R L I N E S</div>
                            </div>
                        </div>
                        <div class="title-area">MEET AND ASSIST (MASS) HAND OVER LIST</div>
                    </div>

                    <div class="flight-info">
                        <div>FLIGHT NO. BS- ${flightNoInput}</div>
                        <div>DATE: ${formattedDate}</div>
                        <div>STATION: ${userData.station}</div>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th style="width: 32%;">NAME OF PASSENGER</th>
                                <th style="width: 10%;">SEAT NO.</th>
                                <th style="width: 13%;">DESTINATION</th>
                                <th style="width: 10%;">CATEGORY</th>
                                <th style="width: 35%;">REMARKS</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tbodyHtml}
                        </tbody>
                    </table>

                    <div class="note">*PLEASE INDICATE: WEHR-WHEEL CHAIR UPTO RAMP, MEDA, UM/YP, ETC.</div>

                    <div class="ack-title">ACKNOWLEDGEMENT</div>

                    <table>
                        <thead>
                            <tr>
                                <th style="width: 15%;"></th>
                                <th style="width: 35%;">NAME/DESIGNATION</th>
                                <th style="width: 15%;">STATION</th>
                                <th style="width: 20%;">SIGNATURE</th>
                                <th style="width: 15%;">DATE</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td style="font-weight:bold; height:35px;">UPLIFT<br>STATION</td>
                                <td>${userData.name} //${userData.designation}</td>
                                <td>${userData.station}</td>
                                <td></td>
                                <td>${formattedDate}</td>
                            </tr>
                            <tr>
                                <td style="font-weight:bold; height:35px;">CABIN<br>CREW</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td style="font-weight:bold; height:35px;">TRANSIT<br>STATION</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td style="font-weight:bold; height:35px;">ARRIVAL<br>STATION</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                        </tbody>
                    </table>
                `;
                
                // Append the completely built page to the container
                reportContainer.appendChild(pageDiv);
            }

            // Switch Screen
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('report-screen').classList.remove('hidden');
        }

        function goBackToDashboard() {
            document.getElementById('report-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
